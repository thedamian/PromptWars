<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Wars</title>
    <style>
      :root {
        --bg-1: #071928;
        --bg-2: #12324d;
        --card: rgba(8, 19, 34, 0.8);
        --panel: rgba(16, 36, 56, 0.9);
        --line: rgba(147, 197, 253, 0.35);
        --accent: #7dd3fc;
        --accent-2: #f472b6;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --text: #edf6ff;
        --muted: #b5d0eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .page {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 18px 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #041321;
        font-size: 1.4rem;
        box-shadow: 0 10px 40px rgba(125, 211, 252, 0.45);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 20px 50px rgba(2, 8, 18, 0.28);
      }

      .panel-label {
        display: block;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .challenge-box {
        padding: 16px 18px;
        border-radius: 16px;
        background: rgba(125, 211, 252, 0.08);
        border: 1px solid rgba(125, 211, 252, 0.22);
        font-size: 1.1rem;
        font-weight: 700;
        line-height: 1.5;
        min-height: 86px;
        display: flex;
        align-items: center;
      }

      .timer {
        margin-top: 18px;
        text-align: center;
        font-size: clamp(2rem, 7vw, 3.3rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--accent);
      }

      .form-wrap {
        margin-top: 18px;
      }

      input, textarea, button {
        font: inherit;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
        font-size: 1rem;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
        font-size: 1rem;
        padding: 16px;
        line-height: 1.5;
      }

      .button-row {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), #a78bfa);
        color: #041321;
        cursor: pointer;
        transition: transform 0.14s ease, box-shadow 0.14s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(125, 211, 252, 0.25);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .result-box {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.64);
        border: 1px solid var(--line);
      }

      .status-track {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .status-step {
        border-radius: 10px;
        padding: 10px 8px;
        border: 1px solid var(--line);
        text-align: center;
        font-size: 0.68rem;
        line-height: 1.3;
        color: var(--muted);
        background: rgba(15, 23, 42, 0.5);
        transition: all 0.2s ease;
      }

      .status-step.done {
        background: rgba(52, 211, 153, 0.18);
        color: #d1fae5;
        border-color: rgba(52, 211, 153, 0.55);
      }

      .status-step.current {
        background: rgba(251, 191, 36, 0.18);
        color: #fef3c7;
        border-color: rgba(251, 191, 36, 0.5);
      }

      .hidden {
        display: none !important;
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="brand">
        <div class="brand-mark">⚡</div>
        <span>Prompt Wars</span>
      </div>

      <div id="setupPanel" class="card">
        <label class="panel-label" for="nameInput">Player name</label>
        <form id="nameForm">
          <input id="nameInput" type="text" maxlength="32" placeholder="Enter your first name" required />
          <div class="button-row">
            <button type="submit">Start</button>
          </div>
        </form>
      </div>

      <div id="gamePanel" class="card hidden">
        <label class="panel-label">Current idea</label>
        <div id="challengeText" class="challenge-box">Waiting for the next prompt...</div>
        <div id="countdown" class="timer">05:00</div>

        <form id="promptForm" class="form-wrap">
          <label class="panel-label" for="promptInput">Your contest prompt</label>
          <textarea id="promptInput" placeholder="Describe the site you want to build..." required></textarea>
          <div class="button-row">
            <button id="submitPromptButton" type="submit">Submit your prompt</button>
          </div>
        </form>

        <div id="statusPanel" class="result-box">
          <div id="submissionMessage" class="muted">Your prompt status will appear here.</div>
          <div class="status-track" aria-live="polite">
            <div class="status-step" data-step="prompt-submitted">Prompt Submitted</div>
            <div class="status-step" data-step="processing">Processing</div>
            <div class="status-step" data-step="website-built">Website Built</div>
            <div class="status-step" data-step="display-it-live">Display it live</div>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const setupPanel = document.getElementById('setupPanel');
      const gamePanel = document.getElementById('gamePanel');
      const nameForm = document.getElementById('nameForm');
      const nameInput = document.getElementById('nameInput');
      const challengeText = document.getElementById('challengeText');
      const countdown = document.getElementById('countdown');
      const promptForm = document.getElementById('promptForm');
      const promptInput = document.getElementById('promptInput');
      const submissionMessage = document.getElementById('submissionMessage');
      const submitPromptButton = document.getElementById('submitPromptButton');
      const statusSteps = document.querySelectorAll('.status-step');

      const order = ['prompt-submitted', 'processing', 'website-built', 'display-it-live'];

      function formatCountdown(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
      }

      function setStatusUI(submission) {
        if (!submission) {
          statusSteps.forEach((step) => step.classList.remove('done', 'current'));
          submissionMessage.textContent = 'Your prompt status will appear here.';
          return;
        }

        const index = order.indexOf(submission.status);
        statusSteps.forEach((step, stepIndex) => {
          step.classList.toggle('done', stepIndex <= index);
          step.classList.toggle('current', stepIndex === index);
        });

        if (submission.status === 'rejected') {
          submissionMessage.textContent = `Rejected: ${submission.rejectedReason || 'Unsafe prompt'}`;
          return;
        }

        const labels = {
          'prompt-submitted': 'Prompt received and queued.',
          'processing': 'Your prompt is being checked and crafted.',
          'website-built': 'Your website is ready in the studio.',
          'display-it-live': 'Your design is live in the arena.'
        };

        submissionMessage.textContent = labels[submission.status] || 'Update received.';
      }

      function revealGame() {
        const savedName = localStorage.getItem('promptWarsPlayerName');
        if (savedName) {
          nameInput.value = savedName;
          setupPanel.classList.add('hidden');
          gamePanel.classList.remove('hidden');
        }
      }

      nameForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          return;
        }

        localStorage.setItem('promptWarsPlayerName', name);
        socket.emit('player:register', { name });
        setupPanel.classList.add('hidden');
        gamePanel.classList.remove('hidden');
      });

      promptForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = localStorage.getItem('promptWarsPlayerName');
        const prompt = promptInput.value.trim();
        if (!name || !prompt) {
          return;
        }

        submitPromptButton.disabled = true;
        socket.emit('player:submit', { name, prompt });
      });

      socket.on('state', (state) => {
        if (!state || !state.currentChallenge) {
          return;
        }

        challengeText.textContent = state.currentChallenge;
        countdown.textContent = formatCountdown(state.remainingMs || 0);

        const savedName = localStorage.getItem('promptWarsPlayerName');
        if (!savedName) {
          return;
        }

        const mySubmissions = (state.submissions || []).filter(
          (item) => item.playerName && item.playerName.toLowerCase() === savedName.toLowerCase()
        );

        const latestSubmission = mySubmissions.sort((a, b) => b.createdAt - a.createdAt)[0];
        if (latestSubmission) {
          setStatusUI(latestSubmission);
        }
      });

      socket.on('player:submission', (submission) => {
        submitPromptButton.disabled = false;
        promptInput.value = '';
        setStatusUI(submission);
      });

      socket.on('player:error', (payload) => {
        submitPromptButton.disabled = false;
        submissionMessage.textContent = payload.message || 'There was a problem with your prompt.';
      });

      revealGame();
    </script>
  </body>
</html>
