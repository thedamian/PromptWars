<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Wars Arena</title>
    <style>
      :root {
        --bg-1: #020b14;
        --bg-2: #102338;
        --panel: rgba(7, 16, 27, 0.9);
        --border: rgba(148, 163, 184, 0.32);
        --accent: #7dd3fc;
        --accent-2: #f472b6;
        --gold: #fbbf24;
        --text: #edf6ff;
        --muted: #bfdbfe;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }

      body {
        overflow: hidden;
      }

      .arena-shell {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .arena-header {
        height: 10vh;
        min-height: 84px;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1.2fr;
        align-items: center;
        padding: 0 18px;
        background: rgba(8, 15, 27, 0.92);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: clamp(1.2rem, 1.6vw, 2.2rem);
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06131f;
        box-shadow: 0 12px 36px rgba(125, 211, 252, 0.45);
      }

      .timer-wrap {
        justify-self: center;
        text-align: center;
      }

      .timer-label {
        display: block;
        font-size: 0.74rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .timer-value {
        font-weight: 900;
        font-size: clamp(1.4rem, 2vw, 2.6rem);
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      .qr-panel {
        justify-self: end;
        width: 100px;
        height: 100px;
        padding: 8px;
        background: rgba(255,255,255,0.96);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 32px rgba(0,0,0,0.18);
      }

      .qr-panel img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .arena-body {
        height: 90vh;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px;
      }

      .challenge-banner {
        text-align: center;
        padding: 12px 18px;
        background: rgba(7, 16, 27, 0.8);
        border: 1px solid var(--border);
        border-radius: 18px;
        font-size: clamp(1.05rem, 1.5vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .submission-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .arena-card {
        background: rgba(14, 24, 38, 0.94);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .arena-viewport {
        flex: 1;
        min-height: 180px;
        background: linear-gradient(135deg, #dbeafe, #f8fafc);
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: white;
      }

      .placeholder {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.5);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <div class="arena-shell">
      <header class="arena-header">
        <div class="brand">
          <div class="brand-mark">⚡</div>
          <span>Prompt Wars</span>
        </div>

        <div class="timer-wrap">
          <span class="timer-label">Round timer</span>
          <div id="countdown" class="timer-value">05:00</div>
        </div>

        <div class="qr-panel">
          <img src="/qr-code.png" alt="Prompt Wars QR code" />
        </div>
      </header>

      <main class="arena-body">
        <div id="challengeBanner" class="challenge-banner">Challenge loading...</div>
        <div id="submissionGrid" class="submission-grid" aria-live="polite"></div>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const challengeBanner = document.getElementById('challengeBanner');
      const countdown = document.getElementById('countdown');
      const submissionGrid = document.getElementById('submissionGrid');
      let lastSubmissionKey = '';

      function formatCountdown(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
      }

      function renderArena(state) {
        if (!state) {
          return;
        }

        challengeBanner.textContent = state.currentChallenge || 'Challenge loading...';
        countdown.textContent = formatCountdown(state.remainingMs || 0);

        const visibleSubmissions = (state.submissions || [])
          .filter((submission) => submission.status === 'display-it-live' && submission.sitePath)
          .sort((a, b) => b.createdAt - a.createdAt)
          .slice(0, 6);

        const currentSubmissionKey = visibleSubmissions
          .map((submission) => `${submission.id}:${submission.sitePath}`)
          .join('|');

        if (currentSubmissionKey === lastSubmissionKey) {
          return;
        }

        lastSubmissionKey = currentSubmissionKey;

        if (!visibleSubmissions.length) {
          submissionGrid.innerHTML = '<div class="placeholder">No finished entries yet</div>';
          return;
        }

        submissionGrid.innerHTML = visibleSubmissions.map((submission) => {
          const siteUrl = new URL(submission.sitePath, window.location.origin).toString();
          return `
            <article class="arena-card">
              <div class="arena-viewport">
                <iframe src="${siteUrl}" title="Live submission preview"></iframe>
              </div>
            </article>`;
        }).join('');
      }

      socket.on('state', renderArena);
    </script>
  </body>
</html>
